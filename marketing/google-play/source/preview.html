<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Campus Cats — illustrative Android previews</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff9f0;
      }
      iframe {
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      title="Illustrative Android interface with fictional community data"
    ></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.querySelector('iframe');
      const slide = Math.min(8, Math.max(1, Number(params.get('slide')) || 1));
      frame.addEventListener('load', async () => {
        const doc = frame.contentDocument;
        doc.documentElement.dataset.android =
          params.get('device') === 'phone' ? 'phone' : 'tablet';
        const stylesheet = doc.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = new URL('./preview.css', location.href).href;
        const stylesReady = new Promise((resolve) =>
          stylesheet.addEventListener('load', resolve, { once: true }),
        );
        doc.head.append(stylesheet);
        doc.querySelector('.island').remove();
        doc.querySelector('.statusbar').innerHTML =
          `<span>9:41</span><span class="android-status" aria-label="Full Wi-Fi and battery"><svg viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0L12 20Z"/></svg><svg viewBox="0 0 14 24"><path d="M5 1h4v2h3v20H2V3h3Z"/></svg></span>`;
        const gesture = doc.createElement('div');
        gesture.className = 'android-gesture';
        doc.querySelector('.screen').append(gesture);
        doc.querySelector('.sample-note').textContent =
          'Illustrative Android interface · Demo community data';
        // Replace the entire Apple Maps background with our own schematic.
        // No third-party map imagery is retained or stripped of attribution.
        const mapURL = new URL('./campus-map.svg', location.href).href;
        doc.querySelectorAll('.map, .history-map').forEach((map) => {
          map.style.backgroundImage = `url("${mapURL}")`;
          let credit = map.querySelector('.map-credit');
          if (!credit) {
            credit = doc.createElement('span');
            credit.className = 'map-credit';
            map.append(credit);
          }
          credit.textContent = 'Illustrative campus map';
        });
        await stylesReady;
        await doc.fonts.ready;
        await Promise.all(
          Array.from(doc.images, (img) =>
            img.complete
              ? Promise.resolve()
              : new Promise((resolve, reject) => {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', reject, { once: true });
                }),
          ),
        );
        if (Array.from(doc.images).some((img) => !img.naturalWidth))
          throw new Error('A preview image failed to load');
        document.documentElement.dataset.ready = 'true';
      });
      frame.src = `../../app-store/source/preview.html?slide=${slide}`;
    </script>
  </body>
</html>
